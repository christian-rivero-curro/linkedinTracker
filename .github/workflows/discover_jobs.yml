name: discover_jobs
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      target_user_id:
        description: 'ID de usuario específico a procesar (dejar vacío para todos)'
        required: false
        default: ''

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Run LinkedIn Guest Scraper
        run: python pipeline/run_linkedin_guest.py
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          LINKEDIN_HOURS_AGO: '4'
          LINKEDIN_MAX_JOBS_PER_VARIANT: '25'
          TARGET_USER_ID: ${{ github.event.inputs.target_user_id || '' }}
      - name: Run LLM Evaluation
        if: always()
        run: python pipeline/run_llm_evaluation.py
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL_SCORING: ${{ vars.OPENROUTER_MODEL_SCORING }}
          LLM_EVALUATION_PROMPT: ${{ vars.LLM_EVALUATION_PROMPT || '' }}
          LLM_CALL_DELAY_SECONDS: '2'
          LLM_MAX_CALLS_PER_RUN: '50'
          TARGET_USER_ID: ${{ github.event.inputs.target_user_id || '' }}

