<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>linkedinTracker</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <style>
    /* ============================================================
       DESIGN TOKENS
       Una sola escala de color, una sola familia tipográfica,
       un único acento. Todo lo demás es neutro.
       ============================================================ */
    :root {
      --bg:        #fbfbfa;
      --surface:   #ffffff;
      --surface-2: #f6f6f5;
      --border:    #e7e7e4;
      --border-strong: #d6d6d1;

      --text:      #18181b;
      --text-2:    #52525b;
      --muted:     #8b8b93;

      --accent:       #2563eb;
      --accent-soft:  #eff4ff;
      --accent-dark:  #1d4ed8;

      --good:  #15803d;
      --warn:  #b45309;
      --bad:   #b91c1c;

      --danger: #b91c1c;
      --success: #15803d;
      --warning: #b45309;
      --primary: #2563eb;
      --text-muted: #8b8b93;

      --radius:    10px;
      --radius-sm: 7px;
      --radius-pill: 999px;

      --shadow-sm: 0 1px 2px rgba(24,24,27,.05);
      --shadow-lg: 0 12px 32px -8px rgba(24,24,27,.22);

      --ring: 0 0 0 3px rgba(37,99,235,.18);
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
      font-size: 15px;
      line-height: 1.55;
      color: var(--text);
      background: var(--bg);
      margin: 0;
      -webkit-font-smoothing: antialiased;
    }

    .shell { max-width: 1040px; margin: 0 auto; padding: 0 1.25rem 5rem; }

    a { color: var(--accent); }

    h1, h2, h3 { letter-spacing: -0.015em; color: var(--text); }
    h1 { font-size: 1.35rem; font-weight: 650; margin: 0 0 .25rem; }
    h2 { font-size: 1.05rem; font-weight: 650; margin: 0 0 .5rem; }
    h3 { font-size: .8rem; font-weight: 650; margin: 1.25rem 0 .5rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }

    .muted { color: var(--muted); font-size: .875rem; }
    em.muted { font-style: normal; }

    /* ============================================================
       TOPBAR
       ============================================================ */
    .topbar {
      border-bottom: 1px solid var(--border);
      background: rgba(251,251,250,.85);
      backdrop-filter: saturate(180%) blur(8px);
      position: sticky; top: 0; z-index: 50;
    }
    .topbar-inner {
      max-width: 1040px; margin: 0 auto;
      padding: .75rem 1.25rem;
      display: flex; align-items: center; gap: 1.25rem;
    }
    .brand {
      font-weight: 650; font-size: .95rem; letter-spacing: -.02em;
      color: var(--text); text-decoration: none; margin-right: auto;
      display: inline-flex; align-items: center; gap: .5rem;
    }
    .brand .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
    .topnav { display: flex; align-items: center; gap: .25rem; }
    .topnav a {
      color: var(--text-2); text-decoration: none; font-weight: 500; font-size: .875rem;
      padding: .35rem .7rem; border-radius: var(--radius-sm);
    }
    .topnav a:hover { background: var(--surface-2); color: var(--text); }
    .topnav a.current { background: var(--surface-2); color: var(--text); }
    .topnav .user {
      font-size: .8rem; color: var(--muted); padding-left: .7rem;
      border-left: 1px solid var(--border); margin-left: .35rem;
    }

    /* ============================================================
       PRIMITIVAS: card, botones, formularios
       ============================================================ */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-bottom: 1.25rem;
    }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: .4rem;
      font: inherit; font-size: .865rem; font-weight: 550;
      padding: .48rem .85rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-strong);
      background: var(--surface); color: var(--text);
      cursor: pointer; text-decoration: none; white-space: nowrap;
      transition: background .12s ease, border-color .12s ease, color .12s ease;
    }
    .btn:hover { background: var(--surface-2); }
    .btn:focus-visible { outline: none; box-shadow: var(--ring); }
    .btn[disabled] { opacity: .55; cursor: not-allowed; }
    .btn-primary { background: var(--text); border-color: var(--text); color: #fff; }
    .btn-primary:hover { background: #000; }
    .btn-quiet { border-color: transparent; background: transparent; color: var(--text-2); }
    .btn-quiet:hover { background: var(--surface-2); color: var(--text); }
    .btn-danger { color: var(--danger); border-color: var(--border-strong); background: var(--surface); }
    .btn-danger:hover { background: #fef2f2; border-color: #fecaca; }
    .btn-sm { padding: .3rem .6rem; font-size: .8rem; }

    /* botón icono cuadrado */
    .icon-btn {
      width: 30px; height: 30px; padding: 0;
      display: inline-flex; align-items: center; justify-content: center;
      border: 1px solid transparent; background: transparent; color: var(--text-2);
      border-radius: var(--radius-sm); cursor: pointer;
      transition: background .12s, color .12s, border-color .12s;
    }
    .icon-btn:hover { background: var(--surface-2); color: var(--text); border-color: var(--border); }
    .icon-btn:focus-visible { outline: none; box-shadow: var(--ring); }
    .icon-btn svg { width: 16px; height: 16px; stroke-width: 1.8; }

    label { font-size: .85rem; font-weight: 550; color: var(--text-2); }

    input[type="text"], input[type="number"], input[type="password"],
    input[type="email"], select, textarea {
      width: 100%;
      font: inherit; font-size: .9rem;
      color: var(--text); background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      padding: .5rem .7rem;
      transition: border-color .12s, box-shadow .12s;
    }
    input:focus, select:focus, textarea:focus {
      outline: none; border-color: var(--accent); box-shadow: var(--ring);
    }
    select {
      appearance: none; cursor: pointer; padding-right: 2rem;
      background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' fill='none' stroke='%238b8b93' stroke-width='1.8' stroke-linecap='round'%3E%3Cpath d='M4 6.5 8 10.5 12 6.5'/%3E%3C/svg%3E");
      background-repeat: no-repeat; background-position: right .55rem center;
    }
    input::placeholder, textarea::placeholder { color: #b4b4bb; }

    /* ============================================================
       CHIPS / BADGES  (una sola forma, variantes por color)
       ============================================================ */
    .chip {
      display: inline-flex; align-items: center; gap: .3rem;
      font-size: .74rem; font-weight: 550; line-height: 1.5;
      padding: .1rem .45rem;
      border-radius: 5px;
      background: var(--surface-2); color: var(--text-2);
      border: 1px solid var(--border);
      white-space: nowrap;
    }
    .chip-accent  { background: var(--accent-soft); color: var(--accent-dark); border-color: #d8e4ff; }
    .chip-good    { background: #f0fdf4; color: var(--good); border-color: #cbeed8; }
    .chip-warn    { background: #fffbeb; color: var(--warn); border-color: #f6e6b8; }
    .chip-bad     { background: #fef2f2; color: var(--bad); border-color: #f7d4d4; }

    /* Pastillas para fuentes de ofertas */
    .chip-source {
      display: inline-flex; align-items: center; gap: .25rem;
      font-size: .71rem; font-weight: 600; line-height: 1.4;
      padding: .08rem .42rem; border-radius: 4px;
      white-space: nowrap; text-transform: none;
    }
    .chip-src-linkedin {
      background: #eff6fc; color: #0a66c2; border: 1px solid #cbe3f7;
    }
    .chip-src-infojobs {
      background: #fff4ed; color: #d9480f; border: 1px solid #ffd8c2;
    }
    .chip-src-indeed {
      background: #f0f4ff; color: #2164f3; border: 1px solid #d4e2fd;
    }
    .chip-src-topsalaries {
      background: #ecfdf5; color: #059669; border: 1px solid #a7f3d0;
    }
    .chip-src-default {
      background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border);
    }

    /* compat con plantillas antiguas */
    .badge { display: inline-flex; align-items: center; font-size: .74rem; font-weight: 550;
             padding: .1rem .45rem; border-radius: 5px; background: var(--surface-2);
             color: var(--text-2); border: 1px solid var(--border); white-space: nowrap; }

    /* ============================================================
       SEGMENTED CONTROL (filtros de estado)
       ============================================================ */
    .segmented {
      display: inline-flex; flex-wrap: wrap; gap: 2px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 3px;
    }
    .segmented a {
      display: inline-flex; align-items: center; gap: .4rem;
      font-size: .85rem; font-weight: 500; text-decoration: none;
      color: var(--text-2); padding: .35rem .7rem; border-radius: 7px;
      transition: background .12s, color .12s;
    }
    .segmented a:hover { color: var(--text); }
    .segmented a[aria-current="true"] {
      background: var(--surface); color: var(--text); font-weight: 600;
      box-shadow: var(--shadow-sm);
    }
    .segmented .n { font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
    .segmented a[aria-current="true"] .n { color: var(--text-2); }

    /* ============================================================
       TOASTS (sustituyen a alert/confirm/prompt)
       ============================================================ */
    #toasts {
      position: fixed; bottom: 1.25rem; right: 1.25rem;
      display: flex; flex-direction: column; gap: .5rem;
      z-index: 2000; pointer-events: none;
    }
    .toast {
      pointer-events: auto;
      display: flex; align-items: center; gap: .85rem;
      background: #18181b; color: #fafafa;
      border-radius: var(--radius); padding: .65rem .9rem;
      font-size: .85rem; box-shadow: var(--shadow-lg);
      animation: toast-in .2s cubic-bezier(.16,1,.3,1);
      max-width: min(92vw, 380px);
    }
    .toast.is-out { animation: toast-out .18s ease forwards; }
    .toast button {
      font: inherit; font-size: .82rem; font-weight: 600;
      background: transparent; border: none; color: #93b4ff;
      cursor: pointer; padding: 0; white-space: nowrap;
    }
    .toast button:hover { color: #fff; text-decoration: underline; }
    .toast.is-error { background: #7f1d1d; }
    @keyframes toast-in  { from { opacity: 0; transform: translateY(8px); } }
    @keyframes toast-out { to   { opacity: 0; transform: translateY(8px); } }

    /* ============================================================
       DIÁLOGO
       ============================================================ */
    dialog {
      border: 1px solid var(--border); border-radius: var(--radius);
      padding: 1.25rem; max-width: 420px; width: calc(100vw - 2.5rem);
      box-shadow: var(--shadow-lg); color: var(--text); background: var(--surface);
    }
    dialog::backdrop { background: rgba(24,24,27,.35); backdrop-filter: blur(2px); }

    @media (max-width: 640px) {
      .shell { padding: 0 .9rem 5rem; }
      .topbar-inner { padding: .65rem .9rem; }
      #toasts { left: .9rem; right: .9rem; bottom: .9rem; }
      .toast { max-width: none; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="/dashboard" class="brand"><img src="/static/favicon-32x32.png" alt="Logo" style="width:20px;height:20px;border-radius:4px;display:block;">linkedinTracker</a>
      <nav class="topnav">
        {% set _path = (request.url.path if request is defined and request else '') %}
        {% if current_user %}
          <a href="/dashboard" class="{{ 'current' if _path.startswith('/dashboard') else '' }}">Ofertas</a>
          <a href="/onboarding" class="{{ 'current' if _path.startswith('/onboarding') else '' }}">Perfil</a>
          <span class="user">{{ current_user.username }}</span>
          <form method="post" action="/logout" style="margin:0;display:inline;">
            <button type="submit" class="btn btn-quiet btn-sm">Salir</button>
          </form>
        {% else %}
          <a href="/login">Iniciar sesión</a>
          <a href="/register">Crear cuenta</a>
        {% endif %}
      </nav>
    </div>
  </header>

  <main class="shell">
    {% block content %}{% endblock %}
  </main>

  <div id="toasts" aria-live="polite" aria-atomic="false"></div>

  <script>
    /* Toast mínimo, con acción opcional (p. ej. "Deshacer"). */
    window.toast = function (message, opts) {
      opts = opts || {};
      const el = document.createElement('div');
      el.className = 'toast' + (opts.error ? ' is-error' : '');
      const text = document.createElement('span');
      text.style.flex = '1';
      text.textContent = message;
      el.appendChild(text);

      if (opts.actionLabel && typeof opts.onAction === 'function') {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = opts.actionLabel;
        btn.addEventListener('click', function () { close(); opts.onAction(); });
        el.appendChild(btn);
      }

      document.getElementById('toasts').appendChild(el);
      let timer = setTimeout(close, opts.duration || (opts.actionLabel ? 6000 : 3200));

      function close() {
        clearTimeout(timer);
        el.classList.add('is-out');
        setTimeout(function () { el.remove(); }, 200);
      }
      return close;
    };
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
