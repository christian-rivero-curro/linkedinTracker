<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>linkedinTracker</title>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <style>
    :root {
      --bg: #f6f7f9;
      --surface: #ffffff;
      --border: #e3e6eb;
      --text: #1c2430;
      --text-muted: #6b7280;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --success: #16a34a;
      --warning: #d97706;
      --danger: #dc2626;
      --linkedin: #0a66c2;
      --radius: 8px;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      max-width: 1150px;
      margin: 0 auto;
      padding: 0 1.25rem 3rem;
      color: var(--text);
      background: var(--bg);
      line-height: 1.5;
    }
    header.topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.1rem 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: 1.5rem;
    }
    header.topbar .brand { font-weight: 700; font-size: 1.1rem; letter-spacing: -0.01em; }
    nav a {
      margin-left: 1.4rem;
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.92rem;
      padding-bottom: 0.3rem;
      border-bottom: 2px solid transparent;
    }
    nav a:hover { color: var(--primary); border-bottom-color: var(--primary); }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.4rem 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04);
    }

    h1 { font-size: 1.4rem; margin: 0 0 0.4rem; }
    h2 { font-size: 1.1rem; margin: 1.4rem 0 0.5rem; }
    h3 { font-size: 0.95rem; margin: 1rem 0 0.4rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.02em; }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      position: relative;
      background: var(--surface);
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.05);
    }
    table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 0.88rem; }
    thead th {
      position: sticky; top: 0;
      background: #f1f3f6;
      text-align: left;
      padding: 0.65rem 0.85rem;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      color: var(--text-muted);
      white-space: nowrap;
      z-index: 1;
    }
    thead th.sortable { cursor: pointer; user-select: none; }
    thead th.sortable:hover { color: var(--primary); }
    thead th.sortable::after { content: "\21C5"; opacity: 0.35; font-size: 0.75em; margin-left: 0.3em; }
    thead th.sort-asc::after { content: "\2191"; opacity: 1; color: var(--primary); }
    thead th.sort-desc::after { content: "\2193"; opacity: 1; color: var(--primary); }
    tbody td { padding: 0.65rem 0.85rem; border-bottom: 1px solid var(--border); vertical-align: middle; background: inherit; }
    tbody tr:nth-child(even) { background: #fafbfc; }
    tbody tr:hover { background: #f0f5ff; }

    /* Dos primeras columnas fijas (Col 1: Selección+Score, Col 2: Puesto & Empresa) */
    .table-wrap th:first-child,
    .table-wrap td:first-child {
      position: sticky;
      left: 0;
      z-index: 2;
      background: #ffffff;
      text-align: center;
      width: 86px;
      min-width: 86px;
      max-width: 86px;
    }
    .table-wrap th:first-child {
      z-index: 4;
      background: #f1f3f6;
    }

    .table-wrap th:nth-child(2),
    .table-wrap td:nth-child(2) {
      position: sticky;
      left: 86px;
      z-index: 2;
      background: #ffffff;
      box-shadow: 4px 0 8px -2px rgba(15, 23, 42, 0.08);
      min-width: 280px;
    }
    .table-wrap th:nth-child(2) {
      z-index: 4;
      background: #f1f3f6;
    }

    .table-wrap tbody tr:nth-child(even) td:first-child,
    .table-wrap tbody tr:nth-child(even) td:nth-child(2) {
      background: #fafbfc;
    }
    .table-wrap tbody tr:hover td:first-child,
    .table-wrap tbody tr:hover td:nth-child(2) {
      background: #f0f5ff;
    }
    .table-wrap tbody tr.selected td:first-child,
    .table-wrap tbody tr.selected td:nth-child(2),
    .table-wrap tbody tr.selected td {
      background: #f0f7ff !important;
    }

    .row-select-checkbox {
      width: 15px;
      height: 15px;
      accent-color: var(--primary);
      cursor: pointer;
      margin: 0;
      vertical-align: middle;
    }
    .col-score-wrapper {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      justify-content: center;
    }

    /* Floating Batch Actions Toolbar */
    .batch-toolbar {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%) translateY(120px);
      opacity: 0;
      pointer-events: none;
      transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
      background: #0f172a;
      color: #ffffff;
      padding: 0.65rem 1.25rem;
      border-radius: 999px;
      box-shadow: 0 12px 28px -4px rgba(0, 0, 0, 0.35), 0 6px 12px -4px rgba(0, 0, 0, 0.2);
      display: flex;
      align-items: center;
      gap: 0.75rem;
      z-index: 1000;
      font-size: 0.85rem;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .batch-toolbar.active {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
      pointer-events: auto;
    }
    .batch-count-badge {
      background: #334155;
      color: #f8fafc;
      padding: 0.2rem 0.65rem;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.78rem;
    }
    .batch-btn {
      border: none;
      border-radius: 999px;
      padding: 0.35rem 0.85rem;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      transition: all 0.15s;
    }
    .batch-btn-danger { background: #ef4444; color: #ffffff; }
    .batch-btn-danger:hover { background: #dc2626; }
    .batch-btn-primary { background: #2563eb; color: #ffffff; }
    .batch-btn-primary:hover { background: #1d4ed8; }
    .batch-btn-warning { background: #f59e0b; color: #ffffff; }
    .batch-btn-warning:hover { background: #d97706; }
    .batch-btn-ghost { background: transparent; color: #cbd5e1; border: 1px solid #475569; }
    .batch-btn-ghost:hover { color: #ffffff; border-color: #94a3b8; background: rgba(255,255,255,0.08); }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 0.85rem;
      margin-bottom: 1.25rem;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.85rem 1rem;
      box-shadow: 0 1px 2px rgba(16, 24, 40, 0.03);
      display: flex;
      flex-direction: column;
      transition: all 0.15s ease;
      text-decoration: none;
      color: inherit;
    }
    .stat-card:hover {
      border-color: #cbd5e1;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      transform: translateY(-1px);
    }
    .stat-card-title {
      font-size: 0.74rem;
      font-weight: 600;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .stat-card-value {
      font-size: 1.5rem;
      font-weight: 700;
      color: #0f172a;
      margin-top: 0.2rem;
      line-height: 1.1;
    }

    /* Modern Search & Filters */
    .search-container {
      position: relative;
      flex: 1;
      min-width: 260px;
    }
    .search-icon {
      position: absolute;
      left: 0.85rem;
      top: 50%;
      transform: translateY(-50%);
      color: #94a3b8;
      font-size: 0.95rem;
      pointer-events: none;
    }
    .search-input {
      width: 100%;
      padding: 0.55rem 2.2rem 0.55rem 2.3rem;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.88rem;
      background: #ffffff;
      outline: none;
      transition: all 0.15s;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }
    .search-clear-btn {
      position: absolute;
      right: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      font-size: 0.9rem;
      padding: 0.2rem;
      display: none;
      line-height: 1;
      margin: 0;
    }
    .search-clear-btn:hover { color: #475569; }

    .filter-badge-count {
      background: rgba(0,0,0,0.06);
      padding: 0.1rem 0.45rem;
      border-radius: 999px;
      font-size: 0.74rem;
      font-weight: 600;
      margin-left: 0.35rem;
    }
    .filters a.active .filter-badge-count {
      background: rgba(255,255,255,0.25);
      color: #ffffff;
    }


    .badge {
      padding: 0.15rem 0.55rem; border-radius: 999px; font-size: 0.72rem;
      font-weight: 600; background: #eef0f3; color: var(--text-muted);
      display: inline-block; white-space: nowrap;
    }
    .badge.linkedin { background: var(--linkedin); color: #fff; }
    .badge.topsalaries { background: #059669; color: #fff; }
    .badge.infojobs { background: #ff6000; color: #fff; }
    .badge.indeed { background: #2164f3; color: #fff; }
    .badge.other { background: #9ca3af; color: #fff; }
    .badge.ai { background: #ede9fe; color: #6d28d9; }
    .badge.manual { background: #e0f2fe; color: #0369a1; }

    /* Modality badges */
    .modality-badge {
      display: inline-flex;
      align-items: center;
      padding: 0.12rem 0.45rem;
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: 600;
      white-space: nowrap;
    }
    .modality-remote { background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0; }
    .modality-hybrid { background: #f0f9ff; color: #0284c7; border: 1px solid #bae6fd; }
    .modality-onsite { background: #f8fafc; color: #475569; border: 1px solid #e2e8f0; }

    /* Enlaces y sublíneas de empleo */
    .job-title-link {
      color: #0f172a;
      font-weight: 600;
      text-decoration: none;
      line-height: 1.35;
      font-size: 0.92rem;
    }
    .job-title-link:hover {
      color: var(--primary);
      text-decoration: underline;
    }
    .external-link-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #64748b;
      text-decoration: none;
      font-size: 0.85rem;
      margin-left: 0.35rem;
      padding: 0.1rem 0.35rem;
      border-radius: 4px;
      transition: all 0.15s;
      vertical-align: middle;
      border: 1px solid #e2e8f0;
      background: #f8fafc;
    }
    .external-link-btn:hover {
      color: var(--primary);
      background: #eff6ff;
      border-color: #bfdbfe;
    }
    .company-subline {
      color: #475569;
      font-size: 0.82rem;
      margin-top: 0.2rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex-wrap: wrap;
    }
    .variant-tag {
      display: inline-flex;
      align-items: center;
      font-size: 0.72rem;
      color: #4338ca;
      background: #eef2ff;
      padding: 0.1rem 0.45rem;
      border-radius: 4px;
      border: 1px solid #c7d2fe;
      text-decoration: none;
    }
    .variant-tag:hover {
      background: #e0e7ff;
    }

    .date-primary { font-size: 0.85rem; font-weight: 500; color: #1e293b; }
    .date-subline { font-size: 0.74rem; color: #64748b; display: block; margin-top: 0.1rem; }

    /* Botones de acción mejorados */
    .action-btn {
      border: none;
      border-radius: 5px;
      padding: 0.28rem 0.55rem;
      font-size: 0.78rem;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.15s;
      margin-right: 0.25rem;
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      text-decoration: none;
    }
    .action-btn-applied { background: #2563eb; color: #ffffff; }
    .action-btn-applied:hover { background: #1d4ed8; }
    .action-btn-interview { background: #f59e0b; color: #ffffff; }
    .action-btn-interview:hover { background: #d97706; }
    .action-btn-secondary { background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; }
    .action-btn-secondary:hover { background: #e2e8f0; color: #1e293b; }
    .action-btn-danger { background: #fee2e2; color: #991b1b; border: 1px solid #fecdd3; }
    .action-btn-danger:hover { background: #fecaca; }

    .score-pill {
      display: inline-block; padding: 0.2rem 0.6rem; border-radius: 999px;
      font-weight: 700; font-size: 0.82rem; color: #fff; min-width: 2.6rem; text-align: center;
    }
    .score-high { background: var(--success); }
    .score-mid { background: var(--warning); }
    .score-low { background: #9ca3af; }

    form { margin: 0; }
    form label { display: block; margin-top: 0.85rem; font-weight: 600; font-size: 0.88rem; }
    input, select, textarea {
      width: 100%; padding: 0.5rem 0.65rem; margin-top: 0.3rem;
      border: 1px solid var(--border); border-radius: 6px; font-size: 0.88rem;
      font-family: inherit; background: #fff; color: var(--text);
    }
    input:focus, select:focus, textarea:focus {
      outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
    }

    button {
      margin-top: 1rem; padding: 0.55rem 1.2rem; cursor: pointer;
      border: none; border-radius: 6px; font-weight: 600; font-size: 0.88rem;
      background: var(--primary); color: #fff; transition: background 0.15s ease;
    }
    button:hover { background: var(--primary-dark); }
    button.secondary { background: #fff; color: var(--text); border: 1px solid var(--border); }
    button.secondary:hover { background: #f1f3f6; }
    button.danger { background: #fff; color: var(--danger); border: 1px solid #fecaca; }
    button.danger:hover { background: #fef2f2; }

    .filters { margin-bottom: 1rem; display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .filters a {
      padding: 0.35rem 0.9rem; border-radius: 999px; font-size: 0.85rem;
      text-decoration: none; color: var(--text-muted); border: 1px solid var(--border);
    }
    .filters a.active { background: var(--primary); color: #fff; border-color: var(--primary); }

    .muted { color: var(--text-muted); font-size: 0.85rem; }
    em.muted { font-style: normal; }

  </style>
</head>
<body>
  <header class="topbar">
    <a href="/dashboard" class="brand" style="text-decoration: none; color: inherit;">linkedinTracker</a>
    <nav style="display: flex; align-items: center; gap: 1rem;">
      {% if current_user %}
        <a href="/dashboard">Dashboard</a>
        <a href="/onboarding">Perfil / CV</a>
        <span style="font-size: 0.85rem; background: #e0e7ff; color: #3730a3; padding: 0.25rem 0.65rem; border-radius: 999px; font-weight: 600;">👤 {{ current_user.username }}</span>
        <form method="post" action="/logout" style="margin: 0; display: inline;">
          <button type="submit" class="secondary" style="padding: 0.25rem 0.6rem; font-size: 0.82rem; margin: 0; cursor: pointer;">Salir</button>
        </form>
      {% else %}
        <a href="/login">Iniciar sesión</a>
        <a href="/register">Crear cuenta</a>
      {% endif %}
    </nav>
  </header>

  {% block content %}{% endblock %}

  <script>
    function initSortableTables() {
      document.querySelectorAll("table.sortable").forEach(function (table) {
        var thead = table.tHead;
        if (!thead) return;
        Array.from(thead.rows[0].cells).forEach(function (th, index) {
          if (!th.classList.contains("sortable")) return;
          th.addEventListener("click", function (e) {
            if (e.target.tagName === 'INPUT' || e.target.closest('input') || e.target.closest('.no-sort')) return;
            var tbody = table.tBodies[0];
            var rows = Array.from(tbody.rows);
            var type = th.getAttribute("data-type") || "text";
            var currentDir = th.classList.contains("sort-asc") ? "asc" : (th.classList.contains("sort-desc") ? "desc" : null);
            var nextDir = currentDir === "asc" ? "desc" : "asc";

            Array.from(thead.rows[0].cells).forEach(function (c) {
              c.classList.remove("sort-asc", "sort-desc");
            });
            th.classList.add(nextDir === "asc" ? "sort-asc" : "sort-desc");

            rows.sort(function (a, b) {
              var aCell = a.cells[index];
              var bCell = b.cells[index];
              var av = aCell.hasAttribute("data-value") ? aCell.getAttribute("data-value") : aCell.textContent.trim();
              var bv = bCell.hasAttribute("data-value") ? bCell.getAttribute("data-value") : bCell.textContent.trim();

              if (type === "number") {
                av = parseFloat(av);
                bv = parseFloat(bv);
                if (isNaN(av)) av = 0;
                if (isNaN(bv)) bv = 0;
                return nextDir === "asc" ? av - bv : bv - av;
              }
              if (type === "date") {
                av = av ? new Date(av).getTime() : 0;
                bv = bv ? new Date(bv).getTime() : 0;
                if (isNaN(av)) av = 0;
                if (isNaN(bv)) bv = 0;
                return nextDir === "asc" ? av - bv : bv - av;
              }
              av = String(av).toLowerCase();
              bv = String(bv).toLowerCase();
              if (av < bv) return nextDir === "asc" ? -1 : 1;
              if (av > bv) return nextDir === "asc" ? 1 : -1;
              return 0;
            });

            rows.forEach(function (row) { tbody.appendChild(row); });
          });
        });
      });
    }
    document.addEventListener("DOMContentLoaded", initSortableTables);
  </script>
</body>
</html>
