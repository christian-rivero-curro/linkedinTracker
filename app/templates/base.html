<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>linkedinTracker</title>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <style>
    :root {
      --bg: #f6f7f9;
      --surface: #ffffff;
      --border: #e3e6eb;
      --text: #1c2430;
      --text-muted: #6b7280;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --success: #16a34a;
      --warning: #d97706;
      --danger: #dc2626;
      --linkedin: #0a66c2;
      --radius: 8px;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      max-width: 1150px;
      margin: 0 auto;
      padding: 0 1.25rem 3rem;
      color: var(--text);
      background: var(--bg);
      line-height: 1.5;
    }
    header.topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.1rem 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: 1.5rem;
    }
    header.topbar .brand { font-weight: 700; font-size: 1.1rem; letter-spacing: -0.01em; }
    nav a {
      margin-left: 1.4rem;
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.92rem;
      padding-bottom: 0.3rem;
      border-bottom: 2px solid transparent;
    }
    nav a:hover { color: var(--primary); border-bottom-color: var(--primary); }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.4rem 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04);
    }

    h1 { font-size: 1.4rem; margin: 0 0 0.4rem; }
    h2 { font-size: 1.1rem; margin: 1.4rem 0 0.5rem; }
    h3 { font-size: 0.95rem; margin: 1rem 0 0.4rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.02em; }

    .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); }
    table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    thead th {
      position: sticky; top: 0;
      background: #f1f3f6;
      text-align: left;
      padding: 0.6rem 0.8rem;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      color: var(--text-muted);
      white-space: nowrap;
    }
    thead th.sortable { cursor: pointer; user-select: none; }
    thead th.sortable:hover { color: var(--primary); }
    thead th.sortable::after { content: "\21C5"; opacity: 0.35; font-size: 0.75em; margin-left: 0.3em; }
    thead th.sort-asc::after { content: "\2191"; opacity: 1; color: var(--primary); }
    thead th.sort-desc::after { content: "\2193"; opacity: 1; color: var(--primary); }
    tbody td { padding: 0.55rem 0.8rem; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tbody tr:nth-child(even) { background: #fafbfc; }
    tbody tr:hover { background: #f0f5ff; }

    .badge {
      padding: 0.15rem 0.55rem; border-radius: 999px; font-size: 0.72rem;
      font-weight: 600; background: #eef0f3; color: var(--text-muted);
      display: inline-block; white-space: nowrap;
    }
    .badge.linkedin { background: var(--linkedin); color: #fff; }
    .badge.topsalaries { background: #059669; color: #fff; }
    .badge.infojobs { background: #ff6000; color: #fff; }
    .badge.indeed { background: #2164f3; color: #fff; }
    .badge.other { background: #9ca3af; color: #fff; }
    .badge.ai { background: #ede9fe; color: #6d28d9; }
    .badge.manual { background: #e0f2fe; color: #0369a1; }

    .score-pill {
      display: inline-block; padding: 0.2rem 0.6rem; border-radius: 999px;
      font-weight: 700; font-size: 0.82rem; color: #fff; min-width: 2.6rem; text-align: center;
    }
    .score-high { background: var(--success); }
    .score-mid { background: var(--warning); }
    .score-low { background: #9ca3af; }

    form { margin: 0; }
    form label { display: block; margin-top: 0.85rem; font-weight: 600; font-size: 0.88rem; }
    input, select, textarea {
      width: 100%; padding: 0.5rem 0.65rem; margin-top: 0.3rem;
      border: 1px solid var(--border); border-radius: 6px; font-size: 0.88rem;
      font-family: inherit; background: #fff; color: var(--text);
    }
    input:focus, select:focus, textarea:focus {
      outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
    }

    button {
      margin-top: 1rem; padding: 0.55rem 1.2rem; cursor: pointer;
      border: none; border-radius: 6px; font-weight: 600; font-size: 0.88rem;
      background: var(--primary); color: #fff; transition: background 0.15s ease;
    }
    button:hover { background: var(--primary-dark); }
    button.secondary { background: #fff; color: var(--text); border: 1px solid var(--border); }
    button.secondary:hover { background: #f1f3f6; }
    button.danger { background: #fff; color: var(--danger); border: 1px solid #fecaca; }
    button.danger:hover { background: #fef2f2; }

    .filters { margin-bottom: 1rem; display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .filters a {
      padding: 0.35rem 0.9rem; border-radius: 999px; font-size: 0.85rem;
      text-decoration: none; color: var(--text-muted); border: 1px solid var(--border);
    }
    .filters a.active { background: var(--primary); color: #fff; border-color: var(--primary); }

    .muted { color: var(--text-muted); font-size: 0.85rem; }
    em.muted { font-style: normal; }
  </style>
</head>
<body>
  <header class="topbar">
    <a href="/dashboard" class="brand" style="text-decoration: none; color: inherit;">linkedinTracker</a>
    <nav style="display: flex; align-items: center; gap: 1rem;">
      {% if current_user %}
        <a href="/dashboard">Dashboard</a>
        <a href="/onboarding">Perfil / CV</a>
        <span style="font-size: 0.85rem; background: #e0e7ff; color: #3730a3; padding: 0.25rem 0.65rem; border-radius: 999px; font-weight: 600;">👤 {{ current_user.username }}</span>
        <form method="post" action="/logout" style="margin: 0; display: inline;">
          <button type="submit" class="secondary" style="padding: 0.25rem 0.6rem; font-size: 0.82rem; margin: 0; cursor: pointer;">Salir</button>
        </form>
      {% else %}
        <a href="/login">Iniciar sesión</a>
        <a href="/register">Crear cuenta</a>
      {% endif %}
    </nav>
  </header>

  {% block content %}{% endblock %}

  <script>
    function initSortableTables() {
      document.querySelectorAll("table.sortable").forEach(function (table) {
        var thead = table.tHead;
        if (!thead) return;
        Array.from(thead.rows[0].cells).forEach(function (th, index) {
          if (!th.classList.contains("sortable")) return;
          th.addEventListener("click", function () {
            var tbody = table.tBodies[0];
            var rows = Array.from(tbody.rows);
            var type = th.getAttribute("data-type") || "text";
            var currentDir = th.classList.contains("sort-asc") ? "asc" : (th.classList.contains("sort-desc") ? "desc" : null);
            var nextDir = currentDir === "asc" ? "desc" : "asc";

            Array.from(thead.rows[0].cells).forEach(function (c) {
              c.classList.remove("sort-asc", "sort-desc");
            });
            th.classList.add(nextDir === "asc" ? "sort-asc" : "sort-desc");

            rows.sort(function (a, b) {
              var aCell = a.cells[index];
              var bCell = b.cells[index];
              var av = aCell.hasAttribute("data-value") ? aCell.getAttribute("data-value") : aCell.textContent.trim();
              var bv = bCell.hasAttribute("data-value") ? bCell.getAttribute("data-value") : bCell.textContent.trim();

              if (type === "number") {
                av = parseFloat(av) || 0;
                bv = parseFloat(bv) || 0;
                return nextDir === "asc" ? av - bv : bv - av;
              }
              if (type === "date") {
                av = av ? new Date(av).getTime() : 0;
                bv = bv ? new Date(bv).getTime() : 0;
                return nextDir === "asc" ? av - bv : bv - av;
              }
              av = String(av).toLowerCase();
              bv = String(bv).toLowerCase();
              if (av < bv) return nextDir === "asc" ? -1 : 1;
              if (av > bv) return nextDir === "asc" ? 1 : -1;
              return 0;
            });

            rows.forEach(function (row) { tbody.appendChild(row); });
          });
        });
      });
    }
    document.addEventListener("DOMContentLoaded", initSortableTables);
  </script>
</body>
</html>
