services:
  linkedin-scraper:
    build:
      context: .
      dockerfile: docker/Dockerfile.linkedin
    env_file:
      - .env
    environment:
      LINKEDIN_HEADLESS: "true"
      LINKEDIN_STORAGE_STATE: /app/linkedin_session/storage_state.json
      LINKEDIN_DIAGNOSTICS_DIR: /app/linkedin_diagnostics
      LINKEDIN_HOURS_AGO: "4"
      LINKEDIN_MAX_JOBS_PER_VARIANT: "25"
    shm_size: "2gb"
    volumes:
      - ./linkedin_session:/app/linkedin_session:ro
      - ./linkedin_diagnostics:/app/linkedin_diagnostics
      - ./pipeline:/app/pipeline
    command: ["python", "pipeline/run_linkedin_scrape.py"]
