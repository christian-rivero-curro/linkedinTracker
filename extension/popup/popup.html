<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JobAutoFill</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="popup-container">
    <!-- Top Header -->
    <header class="header">
      <div class="brand">
        <div class="logo-box">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
            <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
          </svg>
        </div>
        <div>
          <h3>JobAutoFill</h3>
          <span class="sub-label">Ofertas de empleo</span>
        </div>
      </div>
      <button id="btn-open-options" class="icon-btn" title="Abrir configuración completa">
        ⚙️
      </button>
    </header>

    <!-- Profile Summary Card -->
    <div class="profile-card" id="profile-card">
      <div class="profile-avatar" id="profile-avatar">CR</div>
      <div class="profile-meta">
        <strong id="profile-name">Cargando perfil...</strong>
        <span id="profile-email" class="profile-sub">Configura tus datos para comenzar</span>
      </div>
    </div>

    <!-- CV Indicator -->
    <div class="cv-status-pill" id="cv-pill">
      <span class="pill-dot"></span>
      <span id="cv-status-text">CV listo para auto-adjuntar</span>
    </div>

    <!-- Main Action Button -->
    <button id="btn-autofill-now" class="btn-primary-action">
      <span class="btn-icon">⚡</span>
      <span class="btn-text">
        <strong>Rellenar Formulario Ahora</strong>
        <small>Atajo: Alt + Shift + F</small>
      </span>
    </button>

    <!-- Quick Utilities -->
    <div class="quick-tools">
      <button id="btn-copy-cv-path" class="tool-btn" title="Copiar ruta de archivo local de tu CV">
        <span class="tool-icon">📋</span>
        <span>Copiar Ruta CV</span>
      </button>
      <button id="btn-download-cv" class="tool-btn" title="Descargar copia del CV guardado">
        <span class="tool-icon">⬇️</span>
        <span>Descargar CV</span>
      </button>
    </div>

    <!-- Status / Notification Message -->
    <div id="status-message" class="status-box hidden">
      <span id="status-icon">✨</span>
      <span id="status-text">Listo</span>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <button id="btn-edit-profile" class="link-btn">Editar datos de mi perfil</button>
      <span class="version-tag">v1.0</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
